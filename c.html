<script>
  // Lien court du partage du défi du jour (build 87, migration 124) :
  // /c?<code> -> partage enregistré -> page join avec défi, temps,
  // pseudo et uid. Code inconnu ou hors ligne : page join sans défi.
  (function () {
    var page = "/ramio/join";
    var cle = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InprcmthaW1yeWJ4YmRyem54aHh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMDkzMTYsImV4cCI6MjA5NjY4NTMxNn0.28Ns814SQSFXaKRR0-ZrHoX1G8Cpnhf6sNCZ6kgtAio";
    var code = location.search.slice(1).split("&")[0];
    if (!/^[2-9a-zA-Z]{6,10}$/.test(code)) { location.replace(page); return; }
    fetch("https://zkrkaimrybxbdrznxhxx.supabase.co/rest/v1/rpc/lire_partage_defi", {
      method: "POST",
      headers: { apikey: cle, Authorization: "Bearer " + cle, "Content-Type": "application/json" },
      body: JSON.stringify({ p_code: code })
    }).then(function (r) { return r.ok ? r.json() : []; }).then(function (lignes) {
      var p = lignes && lignes[0];
      if (!p) { location.replace(page); return; }
      var q = "defi=" + encodeURIComponent(p.defi) + "&temps=" + p.temps_ms;
      if (p.de) q += "&de=" + encodeURIComponent(p.de);
      if (p.uid) q += "&uid=" + p.uid;
      location.replace(page + "?" + q + "&src=partage-jour");
    }).catch(function () { location.replace(page); });
  })();
</script>
